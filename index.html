<!DOCTYPE html>
<html>
<head>
<title>Nida's Universe 🌌</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="universe">

<h1 id="title"></h1>

<p id="message"></p>

<div class="door">
🚪
</div>

<input id="password" type="password" placeholder="Enter Secret Code">

<button onclick="openUniverse()">
Enter Universe ✨
</button>

<p id="error"></p>

</div>


<script>

let title = "✨ Welcome To Nida's Universe ✨";

let message =
"Among billions of stars in this universe... 🌌\n" +
"one friendship deserved its own little world ❤️";


let i = 0;

function typing(){

if(i < title.length){

document.getElementById("title").innerHTML += title[i];

i++;

setTimeout(typing,80);

}

}

typing();


setTimeout(function(){

document.getElementById("message").innerHTML =
message.replace("\n","<br>");

},2000);



function openUniverse(){

let pass =
document.getElementById("password").value;


if(pass=="1234"){

window.location.href="forest.html";

}

else{

document.getElementById("error").innerHTML =
"Wrong secret code ✨";

}

}

</script>

</body>
</html>
