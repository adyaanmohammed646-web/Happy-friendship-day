<!DOCTYPE html>
<html>
<head>
<title>Friendship Puzzle 🧩</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="puzzle-game">

<h1>🧩 Unlock The Secret</h1>

<p>
Solve the friendship challenge to continue ✨
</p>

<div class="question-box">

<h2 id="question">
Question 1 🌟
</h2>

<p id="quiz">
Who is the person this universe was made for?
</p>

<button onclick="answer('Nida')">
Nida 🌸
</button>

<button onclick="answer('Other')">
Someone else 😅
</button>

</div>


<p id="result"></p>


<button id="next" onclick="nextPage()" style="display:none;">
Unlock Next Chapter 🔓
</button>


</div>


<script>

function answer(choice){

if(choice=="Nida"){

document.getElementById("result").innerHTML =
"Correct! 🎉 You found the secret.";

document.getElementById("next").style.display="inline-block";

}

else{

document.getElementById("result").innerHTML =
"Not this one 😄 Try again.";

}

}


function nextPage(){

window.location.href="timeline.html";

}

</script>


</body>
</html>
