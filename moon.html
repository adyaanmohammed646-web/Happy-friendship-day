<!DOCTYPE html>
<html>
<head>
<title>Nida's Moon Message 🌙</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="moon-world">

<h1>🌙 The Moon Messenger 🌙</h1>

<p>
A special message is hidden inside the moon...
</p>

<div class="big-moon" onclick="revealMoon()">
🌕
</div>

<p id="moonMessage">
Tap the moon ✨
</p>


<button onclick="nextPage()">
Open The Storybook 📖
</button>

</div>


<script>

function revealMoon(){

document.getElementById("moonMessage").innerHTML =
"Dear Nida ❤️<br><br>" +
"Like the moon lights up the night sky,<br>" +
"some friends make life a little brighter.<br><br>" +
"This little universe was created to celebrate our friendship. ✨";

}


function nextPage(){

window.location.href="story.html";

}

</script>

</body>
</html>
