<!DOCTYPE html>
<html>
<head>
<title>Nida's Friendship Story 📖</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="storybook">

<h1>📖 Our Friendship Story 📖</h1>

<div class="book">

<h2 id="chapter">Chapter 1 ✨</h2>

<p id="storyText">
Every special friendship begins with a small moment...
</p>

<button onclick="turnPage()">
Turn Page ➡️
</button>

</div>


<button onclick="nextPage()">
Continue Journey 🌟
</button>

</div>


<script>

let chapters = [
{
title:"Chapter 1 ✨",
text:"Every special friendship begins with a small moment..."
},
{
title:"Chapter 2 🌱",
text:"Slowly, conversations become memories and simple moments become special."
},
{
title:"Chapter 3 💫",
text:"A true friend is someone who brings smiles, support, and happiness."
},
{
title:"Chapter 4 ❤️",
text:"This little universe is a small gift from Affan to Nida, created with effort and care."
}
];


let page = 0;


function turnPage(){

page++;

if(page < chapters.length){

document.getElementById("chapter").innerHTML =
chapters[page].title;

document.getElementById("storyText").innerHTML =
chapters[page].text;

}

else{

document.getElementById("storyText").innerHTML =
"The End? No... every friendship story continues forever ✨";

}

}


function nextPage(){

window.location.href="puzzle.html";

}

</script>


</body>
</html>
